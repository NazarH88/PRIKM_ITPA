---
---
- name: Setup Nodes
  hosts: all
  gather_facts: no
  tasks:
    - name: Bootstrap Python
      raw: apt-get update && apt-get install -y python3
      changed_when: false

    - name: Install Nginx (Example)
      apt:
        name: nginx
        state: present
        update_cache: yes
        
- name: Prepare and Configure Nodes
  hosts: all
  gather_facts: no
  tasks:
    - name: Install Python 3 (Raw command)
      raw: apt-get update && apt-get install -y python3
      changed_when: false

    - name: Install Services
      apt:
        name:
          - curl
          - net-tools
          - nginx
        state: present
        update_cache: yes
        
  - name: Configure All Nodes
    hosts: all
    gather_facts: no
    tasks:
      - name: Install Python 3
        raw: apt-get update && apt-get install -y python3
        changed_when: false

    - name: Install basic tools
      apt:
        name:
          - curl
          - net-tools
        state: present
        update_cache: yes
    - name: Remove old containers
      shell: |
        docker rm -f lab8-prometheus lab8-grafana || true

    - name: Create Prometheus config file
      copy:
        dest: /tmp/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node-exporter'
              static_configs:
                - targets: ['{{ node_exporter_target }}']

    - name: Run Prometheus container
      shell: |
        docker run -d \
        --name lab8-prometheus \
        --network lab8-network \
        -p 9092:9090 \
        -v /tmp/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
        prom/prometheus:latest

    - name: Run Grafana container
      shell: |
        docker run -d \
        --name lab8-grafana \
        --network lab8-network \
        -p 3001:3000 \
        -e GF_SECURITY_ADMIN_USER=admin \
        -e GF_SECURITY_ADMIN_PASSWORD=admin \
        grafana/grafana:latest
